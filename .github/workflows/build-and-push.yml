name: Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v5
        with:
          context: ./images
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k9s-toolbox:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/bigdata-toolbox:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloud-core-toolbox:latest
          file: ./images/k9s-toolbox/Dockerfile
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/k9s-toolbox:latest
